[project]
name = "karaoke-server"
version = "0.1.0"
description = "Karaoke download and processing server"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.0.0",
  "python-multipart",
  "lrcup",
  "korean_romanizer",
  "demucs",
  "moviepy>=2.0.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []